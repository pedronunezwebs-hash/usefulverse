name: Validate and deploy UsefulVerse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_growth600:
        description: "Publicar el hub piloto solo tras aprobar todos los gates y configurar tools.usefulverse.com"
        required: true
        default: false
        type: boolean
      translation_pilot:
        description: "Ejecutar únicamente el piloto de traducción, sin build ni publicación"
        required: false
        default: false
        type: boolean
      pilot_engine:
        description: "Motores locales fijados que comparar"
        required: false
        default: both
        type: choice
        options: [both, m2m100, madlad]
      pilot_policy:
        description: "Baseline o variantes v2–v28; v28 añade referencias bengalíes con contrato propio"
        required: false
        default: baseline
        type: choice
        options: [baseline, context-v2, context-v3, context-v4, context-v5, context-v6, context-v7, context-v8, context-v9, context-v10, context-v11, context-v12, context-v13, context-v14, context-v15, context-v16, context-v17, context-v18, context-v19, context-v20, context-v21, context-v22, context-v23, context-v24, context-v25, context-v26, context-v27, context-v28]
      pilot_scope:
        description: "40 referencias o las tres herramientas completas"
        required: false
        default: references
        type: choice
        options: [references, full]
      pilot_locales:
        description: "Destinos separados por coma; vacío usa los 36 destinos"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: usefulverse-${{ github.ref }}-${{ inputs.translation_pilot && 'translation-pilot' || 'site' }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.event_name != 'workflow_dispatch' || !inputs.translation_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        # The static site bundles browser runtimes; package install hooks are not needed.
        # In particular, onnxruntime-node's hook downloads a native/GPU runtime from NuGet.
        run: npm ci --ignore-scripts

      - name: Run tests
        run: |
          npm test
          python3 -m unittest discover -s scripts/localization -p 'test_translation*.py'

      - name: Build and validate all pages
        run: npm run check

      - name: Require linguistic approval for expanded locales
        run: npm run locale:release-check

      - name: Build and validate the isolated tools hub
        run: npm run build:growth600

      - name: Validate the 300 staged tools without publishing
        if: github.event_name == 'pull_request'
        env:
          GROWTH600_NOINDEX_DRAFT_RELEASE: "1"
          GROWTH600_PREVIEW_ONLY: "1"
          GROWTH600_DIST: dist-new-tools-noindex
        run: npm run build:growth600

      - name: Publish to the existing Cloudflare Pages project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          command: pages deploy dist --project-name=usefulverse --branch=main

      - name: Publish the separate static tools hub
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_growth600 == true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.107.0"
          command: pages deploy dist-growth600 --project-name=usefulverse-tools --branch=main

  translation-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.translation_pilot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: ${{ fromJSON(inputs.pilot_engine == 'both' && '["m2m100","madlad"]' || format('["{0}"]', inputs.pilot_engine)) }}
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PILOT_ENGINE: ${{ matrix.engine }}
      PILOT_POLICY: ${{ inputs.pilot_policy }}
      PILOT_SCOPE: ${{ inputs.pilot_scope }}
      PILOT_LOCALES: ${{ inputs.pilot_locales }}
    steps:
      - name: Check out pilot source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Restrict model storage to this disposable runner
        run: echo "HF_HOME=$RUNNER_TEMP/usefulverse-pilot-hf" >> "$GITHUB_ENV"
      - name: Install pinned CPU-only translation dependencies
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir --disable-pip-version-check -r scripts/localization/pilot-requirements.txt
      - name: Check pilot contracts and extract the real three-tool corpus
        run: |
          python -m unittest discover -s scripts/localization -p 'test_translation*.py'
          node --test scripts/localization/pilot-corpus.test.mjs
          node scripts/localization/pilot-corpus.mjs "$RUNNER_TEMP/pilot-corpus.json"
      - name: Translate, back-translate and checkpoint machine drafts in logs
        run: |
          args=()
          checkpoint="docs/quality/translation-pilot/checkpoints/${PILOT_ENGINE}.jsonl"
          if [ "$PILOT_POLICY" != "baseline" ]; then checkpoint="docs/quality/translation-pilot/checkpoints/${PILOT_POLICY}/${PILOT_ENGINE}.jsonl"; fi
          if [ -f "$checkpoint" ]; then args+=(--resume "$checkpoint"); fi
          python -u scripts/localization/translation-pilot.py run \
            --policy "$PILOT_POLICY" --engine "$PILOT_ENGINE" --scope "$PILOT_SCOPE" --locales "$PILOT_LOCALES" \
            --corpus "$RUNNER_TEMP/pilot-corpus.json" --output "$RUNNER_TEMP/pilot-results.jsonl" "${args[@]}"
      - name: Remove job-owned model downloads and caches
        if: always()
        run: rm -rf -- "$HF_HOME" "$RUNNER_TEMP/usefulverse-pilot-${PILOT_ENGINE}"
