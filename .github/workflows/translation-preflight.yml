name: Translation safety preflight
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  safety:
    if: github.repository == 'pedronunezwebs-hash/usefulverse' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha || 'feat/new-tools-batch-1' }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Check semantics, historical regressions, refinements and preview provenance
        run: python scripts/localization/translation-preflight.py
