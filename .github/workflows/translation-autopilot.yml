name: UsefulVerse translation autopilot
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Fuente inglesa: main o feat/new-tools-batch-1; vacío conserva la última'
        type: string
        default: ''
      minutes:
        description: 'Presupuesto por job (generación + auditoría)'
        type: choice
        default: '240'
        options: ['0', '2', '240']
      locales:
        description: 'Vacío = los 36 destinos; smoke: es'
        type: string
        default: ''
      waves:
        description: 'Una vuelta de prueba o seis vueltas dentro de 24 horas'
        type: choice
        default: '6'
        options: ['1', '6']
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main, feat/new-tools-batch-1]
    paths: ['src/**', 'translation-sources/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: usefulverse-background-drafts
  cancel-in-progress: false
jobs:
  ready:
    if: github.repository == 'pedronunezwebs-hash/usefulverse' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      run_models: ${{ steps.queue.outputs.run_models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: controller
      - name: Resolve the trusted source branch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 controller/scripts/localization/autopilot-plan.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.source.outputs.enabled == 'true'
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.source.outputs.enabled == 'true'
        with:
          ref: automation/translation-results
          path: results
          persist-credentials: false
      - name: Skip model jobs when the queue is already processed
        id: queue
        if: steps.source.outputs.enabled == 'true'
        working-directory: source
        run: |
          node scripts/localization/autopilot-source.mjs "$RUNNER_TEMP/corpus.json"
          python3 scripts/localization/translation-autopilot.py ready --corpus "$RUNNER_TEMP/corpus.json" --memory "$GITHUB_WORKSPACE/results"
  wave-1:
    needs: ready
    if: needs.ready.outputs.run_models == 'true'
    permissions:
      contents: write # Only the reusable publisher uses write; model jobs reduce to read.
      actions: read
    uses: ./.github/workflows/translation-wave.yml
    with:
      source_sha: ${{ needs.ready.outputs.source_sha }}
      source_ref: ${{ needs.ready.outputs.source_ref }}
      minutes: ${{ inputs.minutes || '240' }}
      locales: ${{ inputs.locales || '' }}
  wave-2:
    needs: [ready, wave-1]
    if: success() && inputs.waves != '1' && needs.ready.outputs.run_models == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/translation-wave.yml
    with:
      source_sha: ${{ needs.ready.outputs.source_sha }}
      source_ref: ${{ needs.ready.outputs.source_ref }}
      minutes: ${{ inputs.minutes || '240' }}
      locales: ${{ inputs.locales || '' }}
  wave-3:
    needs: [ready, wave-2]
    if: success() && inputs.waves != '1' && needs.ready.outputs.run_models == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/translation-wave.yml
    with:
      source_sha: ${{ needs.ready.outputs.source_sha }}
      source_ref: ${{ needs.ready.outputs.source_ref }}
      minutes: ${{ inputs.minutes || '240' }}
      locales: ${{ inputs.locales || '' }}
  wave-4:
    needs: [ready, wave-3]
    if: success() && inputs.waves != '1' && needs.ready.outputs.run_models == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/translation-wave.yml
    with:
      source_sha: ${{ needs.ready.outputs.source_sha }}
      source_ref: ${{ needs.ready.outputs.source_ref }}
      minutes: ${{ inputs.minutes || '240' }}
      locales: ${{ inputs.locales || '' }}
  wave-5:
    needs: [ready, wave-4]
    if: success() && inputs.waves != '1' && needs.ready.outputs.run_models == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/translation-wave.yml
    with:
      source_sha: ${{ needs.ready.outputs.source_sha }}
      source_ref: ${{ needs.ready.outputs.source_ref }}
      minutes: ${{ inputs.minutes || '240' }}
      locales: ${{ inputs.locales || '' }}
  wave-6:
    needs: [ready, wave-5]
    if: success() && inputs.waves != '1' && needs.ready.outputs.run_models == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/translation-wave.yml
    with:
      source_sha: ${{ needs.ready.outputs.source_sha }}
      source_ref: ${{ needs.ready.outputs.source_ref }}
      minutes: ${{ inputs.minutes || '240' }}
      locales: ${{ inputs.locales || '' }}
