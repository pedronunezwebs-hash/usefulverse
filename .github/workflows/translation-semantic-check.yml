name: Translation semantic model check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    if: github.repository == 'pedronunezwebs-hash/usefulverse' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: echo "HF_HOME=$RUNNER_TEMP/usefulverse-semantic-hf" >> "$GITHUB_ENV"
      - name: Check contracts before downloading any model
        run: python -m unittest discover -s scripts/localization -p 'test_translation_autopilot.py'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir --disable-pip-version-check -r scripts/localization/pilot-requirements.txt
      - name: Check real independent models on reference meaning changes
        run: python -u scripts/localization/background-semantic.py
      - name: Remove job-owned model files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/usefulverse-semantic-hf"
